{% load static %}{% if campaign.site_photos %}<dialog class="gallery-lightbox" aria-label="Galeria de fotos do Sítio Filadélfia"><button class="gallery-close" type="button" aria-label="Fechar galeria" data-close-gallery>×</button><button class="gallery-arrow previous" type="button" aria-label="Foto anterior">‹</button><figure>{% for photo in campaign.site_photos %}<img src="{% static photo.src %}" alt="{{ photo.alt }}" loading="lazy" {% if not forloop.first %}hidden{% endif %}>{% endfor %}</figure><button class="gallery-arrow next" type="button" aria-label="Próxima foto">›</button></dialog>{% endif %}
