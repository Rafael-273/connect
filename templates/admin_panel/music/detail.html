{% extends "admin_panel/base.html" %}

{% block content %}
<div class="container mx-auto px-6 py-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-semibold text-gray-800">
            Music details
        </h1>

        <a href="{% url 'admin_music_list' %}"
           class="px-4 py-2 text-sm font-medium text-white bg-gray-600 rounded hover:bg-gray-700">
            Back
        </a>
    </div>

    <!-- Card -->
    <div class="bg-white shadow rounded-lg p-6">

        <!-- Music info -->
        <div class="mb-4">
            <p class="text-sm text-gray-500">Music name</p>
            <p class="text-lg font-medium text-gray-800">
                {{ music.name }}
            </p>
        </div>

        <div class="mb-6">
            <p class="text-sm text-gray-500">Singer</p>
            <p class="text-lg font-medium text-gray-800">
                {{ music.singer }}
            </p>
        </div>

        <!-- Chord sheet -->
        <div class="mb-6">
            <p class="text-sm text-gray-500 mb-2">Chord sheet</p>

            {% if music.chord_sheet %}
                <a href="{{ music.chord_sheet.url }}"
                   target="_blank"
                   class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700">
                    Open PDF
                </a>
            {% else %}
                <p class="text-sm text-gray-400">
                    No chord sheet uploaded
                </p>
            {% endif %}
        </div>

        <hr class="my-6">

        <!-- Actions -->
        <div class="flex gap-3">
            <a href="{% url 'admin_music_update' music.id %}"
               class="px-4 py-2 text-sm font-medium text-white bg-yellow-500 rounded hover:bg-yellow-600">
                Edit
            </a>

            <a href="{% url 'admin_music_delete' music.id %}"
               class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded hover:bg-red-700">
                Delete
            </a>
        </div>

    </div>
</div>
{% endblock %}
