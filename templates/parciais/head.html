{% load static %}

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=0.9">

<!-- PWA Meta Tags -->
<link rel="manifest" href="{% static 'manifest.json' %}">
<meta name="theme-color" content="#C90905">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Connect">

<!-- Favicon - múltiplos tamanhos para melhor compatibilidade -->
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'assets/icon-192.png' %}">
<link rel="icon" type="image/png" sizes="512x512" href="{% static 'assets/icon-512.png' %}">
<link rel="icon" type="image/png" href="{% static 'assets/red_icon.png' %}">
<link rel="apple-touch-icon" href="{% static 'assets/icon-192.png' %}">
<link rel="shortcut icon" href="{% static 'assets/favicon.png' %}" type="image/png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<script src="https://cdn.tailwindcss.com"></script>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
