<a href="{{ url }}"
   class="flex flex-col items-center justify-center gap-1.5 bg-white rounded-xl border p-3 text-center transition-all hover:-translate-y-0.5"
   style="border-color: rgba(139,92,246,0.15);">
    <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background: rgba(139,92,246,0.1);">
        <i class="fas fa-{{ icon }} text-sm" style="color: #8B5CF6;"></i>
    </div>
    <span class="text-xs font-bold text-gray-800 leading-tight">{{ label }}</span>
</a>
