{% comment %}Shared navigation. nav_active and ministry_page determine the current section.{% endcomment %}

<style>
    :root { --member-nav-height: 82px; }
    .member-bottom-nav {
        box-sizing: border-box;
        height: calc(var(--member-nav-height) + env(safe-area-inset-bottom));
        padding: 10px max(12px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        background: rgba(255, 255, 255, .97);
        border-top: 1px solid #eceef1;
        box-shadow: 0 -6px 24px rgba(15, 23, 42, .035);
    }
    .member-nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        min-height: 60px;
        border-radius: 14px;
        color: #727987;
        font-size: 11px;
        font-weight: 500;
        line-height: 15px;
        -webkit-tap-highlight-color: transparent;
        transition: color .18s ease;
    }
    .member-nav-item > i {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 32px;
        border-radius: 12px;
        font-size: 21px;
        transition: background-color .18s ease, transform .18s ease;
    }
    .member-nav-item.is-active { color: #C90905; font-weight: 700; }
    .member-nav-item.is-active > i { background: #fff0ef; }
    .member-nav-item:active > i { transform: scale(.94); }
    .member-nav-item:focus-visible { outline: 2px solid #C90905; outline-offset: -2px; }
    .member-nav-item[aria-expanded="true"] { color: #C90905; }
    .member-nav-item[aria-expanded="true"] > i { background: #fff0ef; }
    @media (hover: hover) { .member-nav-item:hover > i { background: #f5f6f8; } }
    .member-more-menu { bottom: calc(var(--member-nav-height) + 8px + env(safe-area-inset-bottom)); }
    .member-nav-spacer { height: calc(var(--member-nav-height) + env(safe-area-inset-bottom)); }
    @media (prefers-reduced-motion: reduce) { .member-bottom-nav * { transition: none !important; } }
</style>
<nav id="bottomNav" class="member-bottom-nav fixed inset-x-0 bottom-0 z-50 backdrop-blur"
     aria-label="Navegação principal">

    <!-- Home -->
    <a href="{% url 'member_dashboard' %}"
       class="member-nav-item {% if nav_active == 'home' %}is-active{% endif %}" {% if nav_active == 'home' %}aria-current="page"{% endif %}>
        <i class="fas fa-house" aria-hidden="true"></i><span>Início</span>
    </a>

    <a href="{% url 'member_dashboard' %}#my-ministries" class="member-nav-item {% if ministry_page or nav_active == 'consolidation' or nav_active == 'curas' or nav_active == 'external_media' or nav_active == 'house_of_peace' %}is-active{% endif %}"><i class="fas fa-users" aria-hidden="true"></i><span>Ministérios</span></a>

    <button id="memberMoreButton" type="button" aria-expanded="false" aria-controls="memberMoreMenu"
       class="member-nav-item {% if nav_active == 'profile' %}is-active{% endif %}">
        <i class="fas fa-ellipsis" aria-hidden="true"></i><span>Mais</span>
    </button>
</nav>
<div id="memberMoreMenu" class="member-more-menu fixed right-3 z-50 hidden w-56 overflow-hidden rounded-2xl border border-gray-100 bg-white p-1.5 shadow-xl" role="menu" aria-label="Mais opções">
    <a href="{% url 'member_profile' %}" role="menuitem" class="flex min-h-12 items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50">
        <i class="fas fa-user-circle w-5 text-[#C90905]"></i>Perfil
    </a>
    {% if user.has_admin_access %}
    <a href="{% url 'admin_dashboard' %}" role="menuitem" class="flex min-h-12 items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-gray-700 hover:bg-gray-50">
        <i class="fas fa-shield-alt w-5 text-[#C90905]"></i>Painel administrativo
    </a>
    {% endif %}
    <a href="{% url 'member_logout' %}" role="menuitem" class="flex min-h-12 items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-red-600 hover:bg-red-50">
        <i class="fas fa-right-from-bracket w-5"></i>Sair
    </a>
</div>
<div class="member-nav-spacer" aria-hidden="true"></div>
<script>
    (function () {
        const button = document.getElementById('memberMoreButton');
        const menu = document.getElementById('memberMoreMenu');
        if (!button || !menu) return;
        const close = () => { menu.classList.add('hidden'); button.setAttribute('aria-expanded', 'false'); };
        button.addEventListener('click', () => {
            const isOpen = !menu.classList.contains('hidden');
            menu.classList.toggle('hidden', isOpen);
            button.setAttribute('aria-expanded', String(!isOpen));
        });
        document.addEventListener('click', (event) => {
            if (!menu.contains(event.target) && !button.contains(event.target)) close();
        });
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') close(); });
    })();
</script>
