{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    {% block head %}{% endblock %}
    {% include 'parciais/head.html' %}
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <title>{% block title %}{% endblock %}</title>
    <style>
        @font-face {
            font-family: "Giga Sans";
            src: url("{% static 'fonts/GigaSansRegular.otf' %}") format("truetype");
            font-style: normal;
        }
        @font-face {
            font-family: "Giga Sans";
            src: url("{% static 'fonts/GigaSansMedium.otf' %}") format("truetype");
            font-style: medium;
        }
        @font-face {
            font-family: "Giga Sans";
            src: url("{% static 'fonts/GigaSansLight.otf' %}") format("truetype");
            font-style: light;
        }
        @font-face {
            font-family: "Tusker";
            src: url("{% static 'fonts/TuskerGrotesk.ttf' %}") format("truetype");
        }
        @font-face {
            font-family: "Integral";
            src: url("{% static 'fonts/Integral.otf' %}") format("truetype");
        }
    </style>
</head>

<body class="{% block body_class %}flex flex-col min-h-screen background-page{% endblock %}" style="background-color: #f7f1ef;">

<div id="admin-menu-container">
    {% include 'parciais/menu.html' %}
</div>

{% block content %}

{% endblock %}

<script>
    if (window.location.pathname.includes('/admin-login')) {
        var menu = document.getElementById('admin-menu-container');
        if (menu) menu.style.display = 'none';
    }
    
    // Função global para controlar submenus
    function toggleSubmenu(submenuId) {
        const submenu = document.getElementById(submenuId);
        if (!submenu) return;
        
        const parentGroup = submenu.parentElement.querySelector('.sidebar-item-group');
        
        if (submenu.classList.contains('active')) {
            submenu.classList.remove('active');
            parentGroup.classList.remove('active');
        } else {
            // Fechar outros submenus
            document.querySelectorAll('.submenu.active').forEach(menu => {
                menu.classList.remove('active');
                const pg = menu.parentElement.querySelector('.sidebar-item-group');
                if (pg) pg.classList.remove('active');
            });
            
            // Abrir o submenu clicado
            submenu.classList.add('active');
            parentGroup.classList.add('active');
        }
    }
    
    $(document).ready(function() {
        $(window).scroll(function() {
            const navbar = $('#navbar');
            if ($(this).scrollTop() > 0) {
                navbar.addClass('menu-scroll');
            } else {
                navbar.removeClass('menu-scroll');
            }
        });
        
        // Mobile admin sidebar toggle
        $('#mobile-sidebar-toggle').on('click', function() {
            $('#mobile-admin-sidebar').removeClass('hidden').addClass('flex');
            $('#mobile-sidebar-content').removeClass('-translate-x-full').addClass('translate-x-0');
            $('body').addClass('mobile-sidebar-open');
        });
        
        $('#close-mobile-sidebar').on('click', function() {
            closeMobileSidebar();
        });
        
        // Close sidebar when clicking outside
        $('#mobile-admin-sidebar').on('click', function(e) {
            if (e.target === this) {
                closeMobileSidebar();
            }
        });
        
        function closeMobileSidebar() {
            $('#mobile-sidebar-content').removeClass('translate-x-0').addClass('-translate-x-full');
            setTimeout(function() {
                $('#mobile-admin-sidebar').removeClass('flex').addClass('hidden');
                $('body').removeClass('mobile-sidebar-open');
            }, 300);
        }

        $(window).on('resize', function() {
            if (window.innerWidth >= 768) {
                closeMobileSidebar();
            }
        });
    
    // Inicializar submenus ativos baseado na página atual
    const activeSubmenuItems = document.querySelectorAll('.submenu-item.active');
    activeSubmenuItems.forEach(item => {
        const submenu = item.closest('.submenu');
        if (submenu) {
            const parentGroup = submenu.parentElement.querySelector('.sidebar-item-group');
            if (parentGroup) {
                submenu.classList.add('active');
                parentGroup.classList.add('active');
            }
        }
    });
});

/* Mobile Bottom Sheet Swipe Handler */
document.addEventListener('DOMContentLoaded', () => {
    // Setup swipe-to-dismiss for all modals on mobile
    const isHugeSmallScreen = window.innerWidth <= 768;
    if (!isHugeSmallScreen) return; // Only on mobile

    const modalIds = [
        'divisionAssignModal', 
        'calendarModal', 
        'dayAssignmentModal', 
        'dayModal',
        'deleteModal',
        'duplicateModal',
        'cropModal'
    ];

    modalIds.forEach(modalId => {
        const modal = document.getElementById(modalId);
        if (!modal) return;

        const modalCard = modal.querySelector('.modal-card, .modal-content, .modal-overlay');
        if (!modalCard) return;

        let touchStartY = 0;
        let touchCurrentY = 0;
        let isDragging = false;

        modalCard.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            isDragging = true;
            modalCard.style.transition = 'none';
        }, false);

        modalCard.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            touchCurrentY = e.touches[0].clientY;
            const diff = touchCurrentY - touchStartY;
            
            // Only drag downward
            if (diff > 0) {
                modalCard.style.transform = `translateY(${diff}px)`;
            }
        }, false);

        modalCard.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            const diff = touchCurrentY - touchStartY;
            const threshold = 150; // 150px threshold to dismiss
            
            if (diff > threshold) {
                // Swipe down far enough - close modal
                modalCard.classList.add('closing');
                modal.style.animation = 'slideDown 0.2s ease-out forwards';
                
                setTimeout(() => {
                    // Find and call the appropriate close function
                    const closeButton = modal.querySelector('[onclick*="close"]');
                    if (closeButton && closeButton.onclick) {
                        closeButton.onclick();
                    } else {
                        // Fallback: just hide the modal
                        modal.classList.add('hidden');
                        modalCard.style.transform = '';
                        modalCard.style.transition = '';
                    }
                }, 200);
            } else {
                // Snap back
                modalCard.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
                modalCard.style.transform = '';
            }
        }, false);
    });

    // Re-setup on window resize if going from desktop to mobile
    let lastWidth = window.innerWidth;
    window.addEventListener('resize', () => {
        if (lastWidth > 768 && window.innerWidth <= 768) {
            // Crossed into mobile - reload
            location.reload();
        }
        lastWidth = window.innerWidth;
    });
});
</script><style>
    /* Desktop and Mobile admin styling */
    @media screen and (min-width: 769px) {
        .main-content-wrapper {
            margin-left: 18rem !important;
        }
    }

    .main-content-wrapper > .mt-24 {
        margin-top: 0 !important;
    }
    
    @media (max-width: 768px) {
        .main-content-wrapper {
            margin-left: 0 !important;
            width: 100% !important;
            padding-top: 5rem;
        }
        
        .admin-card {
            padding: 0.75rem !important;
        }
        
        .form-group {
            margin-bottom: 1rem !important;
        }
        
        .grid {
            gap: 1rem !important;
        }
        
        /* Buttons in header sections */
        .header-actions {
            flex-direction: column !important;
            width: 100% !important;
            gap: 0.5rem !important;
        }
        
        /* Responsive tables */
        .table-responsive {
            display: block;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Responsive form layouts */
        .form-row {
            flex-direction: column !important;
        }
        
        /* Fix for flex items in mobile view */
        .flex-col-mobile {
            flex-direction: column !important;
        }
    }

    /* iPhone zoom prevention - 16px minimum for all inputs */
    .form-input, .form-textarea {
        font-size: 16px !important;
    }
    
    /* Bottom Sheet Modal Helper */
    .modal-swipe-handler {
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
    }
    
    /* Improved form responsiveness */
    @media (max-width: 640px) {
        /* Card adjustments for very small screens */
        .admin-card {
            border-radius: 8px !important;
        }
    }
    
    /* Sidebar styling */
    .sidebar {
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.09);
        border-right: 1px solid rgba(148, 163, 184, 0.24);
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.55) transparent;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
    }

    .sidebar::-webkit-scrollbar {
        width: 8px;
    }

    .sidebar::-webkit-scrollbar-track {
        background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.45);
        border-radius: 9999px;
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
        background-color: rgba(100, 116, 139, 0.7);
    }

    .sidebar-scroll {
        height: 100vh;
    }

    .sidebar-brand {
        background: linear-gradient(135deg, rgba(201, 9, 5, 0.04), rgba(230, 57, 70, 0.015));
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .sidebar-nav {
        padding-bottom: 1.25rem;
    }

    .member-area-link {
        background: transparent;
        color: #475569;
        justify-content: flex-start;
        font-weight: 500;
        letter-spacing: 0;
        border-left-color: transparent;
        border-color: transparent;
        box-shadow: none;
        margin: 0.12rem 0.55rem;
        border-radius: 10px;
    }

    .member-area-link:hover {
        color: #111827;
        transform: none;
        border-left-color: transparent;
        border-color: transparent;
        background: #ffffff;
    }
    
    .sidebar-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 10px 14px;
        margin: 0.12rem 0.55rem;
        border-radius: 10px;
        color: #475569;
        font-weight: 500;
        font-size: 0.98rem;
        text-decoration: none;
        transition: all 0.22s ease;
        border: 1px solid transparent;
        position: relative;
    }

    .sidebar-item:hover, .sidebar-item.active {
        background-color: #ffffff;
        color: var(--color-primary);
        border-color: rgba(201, 9, 5, 0.16);
        box-shadow: 0 5px 14px rgba(15, 23, 42, 0.07);
        text-decoration: none;
    }

    .sidebar-item.active::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 9999px;
        background: var(--color-primary);
    }

    .sidebar-item ion-icon {
        font-size: 19px;
        min-width: 19px;
        margin-right: 0;
        opacity: 0.9;
    }

    /* Submenu styling */
    .sidebar-group {
        margin: 0.2rem 0;
    }

    .sidebar-item-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 10px 14px;
        margin: 0.12rem 0.55rem;
        border-radius: 10px;
        color: #475569;
        font-size: 0.98rem;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.22s ease;
        border: 1px solid transparent;
        cursor: pointer;
        user-select: none;
        position: relative;
    }

    .sidebar-item-group:hover, .sidebar-item-group.active {
        background-color: #ffffff;
        color: var(--color-primary);
        border-color: rgba(201, 9, 5, 0.16);
        box-shadow: 0 5px 14px rgba(15, 23, 42, 0.07);
    }

    .sidebar-item-group.active::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 9999px;
        background: var(--color-primary);
    }

    .sidebar-item-group ion-icon {
        font-size: 19px;
        min-width: 19px;
        margin-right: 0;
    }

    .sidebar-item-group-main {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
    }

    .submenu-arrow {
        margin-left: auto;
        font-size: 14px;
        transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        color: #6b7280;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        padding: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
    }

    .sidebar-item-group:hover .submenu-arrow {
        color: var(--color-primary);
        background: linear-gradient(180deg, #fff1f1 0%, #fee2e2 100%);
        border-color: rgba(201, 9, 5, 0.3);
        box-shadow: none;
        transform: scale(1.03);
    }

    .sidebar-item-group.active .submenu-arrow {
        transform: rotate(180deg) scale(1.03);
        background: linear-gradient(180deg, #c90905 0%, #b20804 100%);
        border-color: rgba(201, 9, 5, 0.75);
        color: #ffffff;
        box-shadow: none;
    }

    .submenu {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        background-color: transparent;
        margin: 0 0.55rem 0.4rem;
        border-radius: 0;
    }

    .submenu.active {
        max-height: 560px;
    }

    .submenu-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 9px 12px 9px 34px;
        color: #64748b;
        text-decoration: none;
        transition: all 0.22s ease;
        border: 1px solid transparent;
        font-size: 14px;
        font-weight: 500;
        border-radius: 8px;
        margin: 0.12rem 0.1rem;
    }

    .submenu-item ion-icon {
        font-size: 16px;
        margin-right: 0;
    }

    .submenu-item:hover, .submenu-item.active {
        background-color: #f8fafc;
        color: var(--color-primary);
        border-color: rgba(201, 9, 5, 0.14);
        text-decoration: none;
    }

    body.mobile-sidebar-open {
        overflow: hidden;
        touch-action: none;
    }

    #mobile-admin-sidebar {
        backdrop-filter: blur(2px);
    }

    #mobile-sidebar-content {
        max-width: 22rem;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        box-shadow: 12px 0 30px rgba(15, 23, 42, 0.2);
    }

    @media (max-width: 768px) {
        .sidebar-item,
        .sidebar-item-group {
            padding: 11px 14px;
            margin: 0.1rem 0.5rem;
        }

        .submenu-item {
            padding: 10px 12px 10px 32px;
        }
    }
</style>

</html>
