{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    {% block head %}{% endblock %}
    {% include 'parciais/head.html' %}
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <title>{% block title %}{% endblock %}</title>
    <!-- Apply sidebar collapsed state before first paint to avoid open animation -->
    <script>
        (function(){
            if (localStorage.getItem('admin_sidebar_collapsed') === '1') {
                document.documentElement.classList.add('admin-sidebar-collapsed-preload');
            }
        })();
    </script>
    <!-- Suppress ALL transitions and animations until after first paint -->
    <style id="no-transitions-preload">
        *, *::before, *::after {
            transition-duration: 0ms !important;
            animation-duration: 0ms !important;
        }
    </style>
    <style>
        /* Suppress sidebar collapse transition during initial load */
        html.admin-sidebar-collapsed-preload #admin-sidebar,
        html.admin-sidebar-collapsed-preload .main-content-wrapper {
            transition: none !important;
        }
    </style>
    <style>
        @font-face {
            font-family: "Giga Sans";
            src: url("{% static 'fonts/GigaSansRegular.otf' %}") format("truetype");
            font-style: normal;
        }
        @font-face {
            font-family: "Giga Sans";
            src: url("{% static 'fonts/GigaSansMedium.otf' %}") format("truetype");
            font-style: medium;
        }
        @font-face {
            font-family: "Giga Sans";
            src: url("{% static 'fonts/GigaSansLight.otf' %}") format("truetype");
            font-style: light;
        }
        @font-face {
            font-family: "Tusker";
            src: url("{% static 'fonts/TuskerGrotesk.ttf' %}") format("truetype");
        }
        @font-face {
            font-family: "Integral";
            src: url("{% static 'fonts/Integral.otf' %}") format("truetype");
        }
    </style>
</head>

<body class="{% block body_class %}flex flex-col min-h-screen background-page{% endblock %}" style="background-color: #f7f1ef;">

<div id="admin-menu-container">
    {% include 'parciais/menu.html' %}
</div>

{% block content %}

{% endblock %}

<script>
    if (window.location.pathname.includes('/admin-login')) {
        var menu = document.getElementById('admin-menu-container');
        if (menu) menu.style.display = 'none';
    }
    
    // Função global para controlar submenus
    function toggleSubmenu(submenuId) {
        if (document.body.classList.contains('admin-sidebar-collapsed')) return;

        const submenu = document.getElementById(submenuId);
        if (!submenu) return;
        
        const parentGroup = submenu.parentElement.querySelector('.sidebar-item-group');
        
        if (submenu.classList.contains('active')) {
            submenu.classList.remove('active');
            parentGroup.classList.remove('active');
        } else {
            // Fechar outros submenus
            document.querySelectorAll('.submenu.active').forEach(menu => {
                menu.classList.remove('active');
                const pg = menu.parentElement.querySelector('.sidebar-item-group');
                if (pg) pg.classList.remove('active');
            });
            
            // Abrir o submenu clicado
            submenu.classList.add('active');
            parentGroup.classList.add('active');
        }
    }
    
    $(document).ready(function() {
        const sidebarCollapseKey = 'admin_sidebar_collapsed';

        function applySidebarState(collapsed) {
            if (window.innerWidth < 769) return;
            document.body.classList.toggle('admin-sidebar-collapsed', collapsed);

            const toggleBtn = document.getElementById('sidebar-collapse-toggle');
            if (toggleBtn) {
                toggleBtn.setAttribute('aria-pressed', collapsed ? 'true' : 'false');
                toggleBtn.setAttribute('title', collapsed ? 'Expandir menu' : 'Minimizar menu');
            }
        }

        function toggleSidebarCollapsed() {
            const collapsed = !document.body.classList.contains('admin-sidebar-collapsed');
            applySidebarState(collapsed);
            localStorage.setItem(sidebarCollapseKey, collapsed ? '1' : '0');
        }

        const initialCollapsed = localStorage.getItem(sidebarCollapseKey) === '1';
        applySidebarState(initialCollapsed);
        // Re-enable transitions after first paint (double-rAF ensures we wait for the frame to be drawn)
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                var noTrans = document.getElementById('no-transitions-preload');
                if (noTrans) noTrans.parentNode.removeChild(noTrans);
                document.documentElement.classList.remove('admin-sidebar-collapsed-preload');
            });
        });

        const sidebarToggleBtn = document.getElementById('sidebar-collapse-toggle');
        if (sidebarToggleBtn) {
            sidebarToggleBtn.addEventListener('click', toggleSidebarCollapsed);
        }

        $(window).scroll(function() {
            const navbar = $('#navbar');
            if ($(this).scrollTop() > 0) {
                navbar.addClass('menu-scroll');
            } else {
                navbar.removeClass('menu-scroll');
            }
        });
        
        // Mobile admin sidebar toggle
        $('#mobile-sidebar-toggle').on('click', function() {
            $('#mobile-admin-sidebar').removeClass('hidden').addClass('flex');
            $('#mobile-sidebar-content').removeClass('-translate-x-full').addClass('translate-x-0');
            $('body').addClass('mobile-sidebar-open');
        });
        
        $('#close-mobile-sidebar').on('click', function() {
            closeMobileSidebar();
        });
        
        // Close sidebar when clicking outside
        $('#mobile-admin-sidebar').on('click', function(e) {
            if (e.target === this) {
                closeMobileSidebar();
            }
        });
        
        function closeMobileSidebar() {
            $('#mobile-sidebar-content').removeClass('translate-x-0').addClass('-translate-x-full');
            setTimeout(function() {
                $('#mobile-admin-sidebar').removeClass('flex').addClass('hidden');
                $('body').removeClass('mobile-sidebar-open');
            }, 300);
        }

        $(window).on('resize', function() {
            if (window.innerWidth >= 768) {
                closeMobileSidebar();
                applySidebarState(localStorage.getItem(sidebarCollapseKey) === '1');
            } else {
                document.body.classList.remove('admin-sidebar-collapsed');
            }
        });
    
    // Inicializar submenus ativos baseado na página atual
    const activeSubmenuItems = document.querySelectorAll('.submenu-item.active');
    activeSubmenuItems.forEach(item => {
        const submenu = item.closest('.submenu');
        if (submenu) {
            const parentGroup = submenu.parentElement.querySelector('.sidebar-item-group');
            if (parentGroup) {
                submenu.classList.add('active');
                parentGroup.classList.add('active');
            }
        }
    });
});
</script><style>
    /* Desktop and Mobile admin styling */
    @media screen and (min-width: 769px) {
        .main-content-wrapper {
            margin-left: 18rem !important;
            transition: margin-left 0.2s ease;
        }

        body.admin-sidebar-collapsed .main-content-wrapper {
            margin-left: 5.5rem !important;
        }
    }

    .main-content-wrapper > .mt-24 {
        margin-top: 0 !important;
    }
    
    @media (max-width: 768px) {
        .main-content-wrapper {
            margin-left: 0 !important;
            width: 100% !important;
            padding-top: 5rem;
        }
        
        .admin-card {
            padding: 0.75rem !important;
        }
        
        .form-group {
            margin-bottom: 1rem !important;
        }
        
        .grid {
            gap: 1rem !important;
        }
        
        /* Buttons in header sections */
        .header-actions {
            flex-direction: column !important;
            width: 100% !important;
            gap: 0.5rem !important;
        }
        
        /* Responsive tables */
        .table-responsive {
            display: block;
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Responsive form layouts */
        .form-row {
            flex-direction: column !important;
        }
        
        /* Fix for flex items in mobile view */
        .flex-col-mobile {
            flex-direction: column !important;
        }
    }
    
    /* Improved form responsiveness */
    @media (max-width: 640px) {
        .form-input, .form-textarea {
            font-size: 16px !important; /* Prevent zoom on iOS */
        }
        
        /* Card adjustments for very small screens */
        .admin-card {
            border-radius: 8px !important;
        }
    }
    
    /* Sidebar styling */
    .sidebar {
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.09);
        border-right: 1px solid rgba(148, 163, 184, 0.24);
        scrollbar-width: none;
        -ms-overflow-style: none;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
    }

    .sidebar-inner-scroll::-webkit-scrollbar {
        width: 0;
        display: none;
    }

    .sidebar-scroll {
        height: 100vh;
    }

    .sidebar-inner-scroll {
        height: 100%;
        overflow-y: auto;
        overflow-x: visible;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
    }

    .sidebar-brand {
        background: linear-gradient(135deg, rgba(201, 9, 5, 0.04), rgba(230, 57, 70, 0.015));
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    #admin-sidebar {
        width: 18rem;
        transition: width 0.2s ease;
        overflow: visible !important;
    }

    .sidebar-collapse-toggle {
        width: 32px;
        height: 32px;
        border: 1px solid #d1d5db;
        border-radius: 999px;
        background: white;
        color: #64748b;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 36px;
        right: -16px;
        z-index: 60;
        transition: all 0.18s;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.12);
    }

    .sidebar-collapse-toggle:hover {
        border-color: rgba(201, 9, 5, 0.4);
        color: var(--color-primary);
        background: #fffafa;
    }

    .collapse-icon-collapsed { display: none; }

    body.admin-sidebar-collapsed #admin-sidebar {
        width: 5.5rem !important;
    }

    body.admin-sidebar-collapsed .sidebar-brand-logo {
        display: block;
        height: 2rem !important;
        width: auto;
    }

    body.admin-sidebar-collapsed .sidebar-collapse-toggle {
        right: -16px;
    }

    body.admin-sidebar-collapsed .collapse-icon-expanded { display: none; }
    body.admin-sidebar-collapsed .collapse-icon-collapsed { display: inline-flex; }

    body.admin-sidebar-collapsed .sidebar-item,
    body.admin-sidebar-collapsed .member-area-link {
        justify-content: center;
        gap: 0;
        padding-left: 10px;
        padding-right: 10px;
        font-size: 0;
    }

    body.admin-sidebar-collapsed .sidebar-item ion-icon,
    body.admin-sidebar-collapsed .member-area-link ion-icon {
        font-size: 20px;
    }

    body.admin-sidebar-collapsed .sidebar-item span,
    body.admin-sidebar-collapsed .member-area-link span,
    body.admin-sidebar-collapsed .sidebar-item-group span,
    body.admin-sidebar-collapsed .submenu-arrow,
    body.admin-sidebar-collapsed .submenu {
        display: none !important;
    }

    body.admin-sidebar-collapsed .sidebar-item-group {
        justify-content: center;
        padding-left: 10px;
        padding-right: 10px;
        pointer-events: none;
    }

    body.admin-sidebar-collapsed .sidebar-item-group-main {
        justify-content: center;
    }

    .sidebar-nav {
        padding-bottom: 1.25rem;
    }

    .member-area-link {
        background: transparent;
        color: #475569;
        justify-content: flex-start;
        font-weight: 500;
        letter-spacing: 0;
        border-left-color: transparent;
        border-color: transparent;
        box-shadow: none;
        margin: 0.12rem 0.55rem;
        border-radius: 10px;
    }

    .member-area-link:hover {
        color: #111827;
        transform: none;
        border-left-color: transparent;
        border-color: transparent;
        background: #ffffff;
    }
    
    .sidebar-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 10px 14px;
        margin: 0.12rem 0.55rem;
        border-radius: 10px;
        color: #475569;
        font-weight: 500;
        font-size: 0.98rem;
        text-decoration: none;
        transition: all 0.22s ease;
        border: 1px solid transparent;
        position: relative;
    }

    .sidebar-item:hover, .sidebar-item.active {
        background-color: #ffffff;
        color: var(--color-primary);
        border-color: rgba(201, 9, 5, 0.16);
        box-shadow: 0 5px 14px rgba(15, 23, 42, 0.07);
        text-decoration: none;
    }

    .sidebar-item.active::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 9999px;
        background: var(--color-primary);
    }

    .sidebar-item ion-icon {
        font-size: 19px;
        min-width: 19px;
        margin-right: 0;
        opacity: 0.9;
    }

    /* Submenu styling */
    .sidebar-group {
        margin: 0.2rem 0;
    }

    .sidebar-item-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 10px 14px;
        margin: 0.12rem 0.55rem;
        border-radius: 10px;
        color: #475569;
        font-size: 0.98rem;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.22s ease;
        border: 1px solid transparent;
        cursor: pointer;
        user-select: none;
        position: relative;
    }

    .sidebar-item-group:hover, .sidebar-item-group.active {
        background-color: #ffffff;
        color: var(--color-primary);
        border-color: rgba(201, 9, 5, 0.16);
        box-shadow: 0 5px 14px rgba(15, 23, 42, 0.07);
    }

    .sidebar-item-group.active::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 9999px;
        background: var(--color-primary);
    }

    .sidebar-item-group ion-icon {
        font-size: 19px;
        min-width: 19px;
        margin-right: 0;
    }

    .sidebar-item-group-main {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
    }

    .submenu-arrow {
        margin-left: auto;
        font-size: 14px;
        transition: transform 0.24s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        color: #6b7280;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        padding: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: none;
    }

    .sidebar-item-group:hover .submenu-arrow {
        color: var(--color-primary);
        background: linear-gradient(180deg, #fff1f1 0%, #fee2e2 100%);
        border-color: rgba(201, 9, 5, 0.3);
        box-shadow: none;
        transform: scale(1.03);
    }

    .sidebar-item-group.active .submenu-arrow {
        transform: rotate(180deg) scale(1.03);
        background: linear-gradient(180deg, #c90905 0%, #b20804 100%);
        border-color: rgba(201, 9, 5, 0.75);
        color: #ffffff;
        box-shadow: none;
    }

    .submenu {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        background-color: transparent;
        margin: 0 0.55rem 0.4rem;
        border-radius: 0;
    }

    .submenu.active {
        max-height: 560px;
    }

    .submenu-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 9px 12px 9px 34px;
        color: #64748b;
        text-decoration: none;
        transition: all 0.22s ease;
        border: 1px solid transparent;
        font-size: 14px;
        font-weight: 500;
        border-radius: 8px;
        margin: 0.12rem 0.1rem;
    }

    .submenu-item ion-icon {
        font-size: 16px;
        margin-right: 0;
    }

    .submenu-item:hover, .submenu-item.active {
        background-color: #f8fafc;
        color: var(--color-primary);
        border-color: rgba(201, 9, 5, 0.14);
        text-decoration: none;
    }

    body.mobile-sidebar-open {
        overflow: hidden;
        touch-action: none;
    }

    #mobile-admin-sidebar {
        backdrop-filter: blur(2px);
    }

    #mobile-sidebar-content {
        max-width: 22rem;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        box-shadow: 12px 0 30px rgba(15, 23, 42, 0.2);
    }

    @media (max-width: 768px) {
        .sidebar-item,
        .sidebar-item-group {
            padding: 11px 14px;
            margin: 0.1rem 0.5rem;
        }

        .submenu-item {
            padding: 10px 12px 10px 32px;
        }
    }

    /* Row link — primeira coluna clicável nas listagens */
    td.row-link {
        cursor: pointer;
    }
    td.row-link:hover {
        background-color: rgba(0, 0, 0, 0.025);
    }
</style>
<script>
    // Row link — clicar na primeira coluna abre o detalhe do item
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('td[data-row-href]').forEach(function(td) {
            td.addEventListener('click', function(e) {
                if (e.target.closest('a, button, input, select, textarea')) return;
                window.location.href = td.dataset.rowHref;
            });
        });
    });
</script>
</body>
</html>
