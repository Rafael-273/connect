{% if page_obj.has_other_pages %}<nav aria-label="Paginação" class="flex justify-center items-center gap-4 mt-6 text-sm">{% if page_obj.has_previous %}<a class="text-purple-700" href="?{{ pagination_query }}&page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}<span>{{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="text-purple-700" href="?{{ pagination_query }}&page={{ page_obj.next_page_number }}">Próxima</a>{% endif %}</nav>{% endif %}
