<div class="template-demand-modal" role="dialog" aria-modal="true" aria-labelledby="{{ title_id }}">
    <a href="{{ close_url }}" class="template-demand-backdrop" aria-label="Fechar"></a>
    <div class="template-demand-card">
        <div class="sticky top-0 z-10 flex items-start justify-between gap-3 px-5 py-4 border-b border-gray-100 bg-white">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white" style="background:#C90905;"><i class="fas fa-clipboard-list"></i></div>
                <div>
                    <p class="text-[10px] font-bold uppercase tracking-wider text-red-600">{{ eyebrow }}</p>
                    <h2 id="{{ title_id }}" class="text-lg font-bold text-gray-900">{{ title }}</h2>
                    <p class="text-xs text-gray-500 mt-0.5">{{ subtitle }}{{ event_type.name }}.</p>
                </div>
            </div>
            <a href="{{ close_url }}" class="w-9 h-9 rounded-lg bg-gray-100 text-gray-400 flex items-center justify-center" aria-label="Fechar"><i class="fas fa-times"></i></a>
        </div>
        <form method="post" action="{{ post_url }}" class="demands-modal-body">
            {% csrf_token %}
            {{ form.sort_order }}
            {% include 'member/media_planning/partials/template_demand_form_fields.html' with form=form prefix='template' template_assignments=assignments %}
            <div class="sticky bottom-0 flex gap-2 pt-3 pb-1 bg-white border-t border-gray-100">
                <a href="{{ close_url }}" class="org-btn-secondary flex-1 justify-center">Cancelar</a>
                <button type="submit" class="org-btn-primary flex-1">{{ submit_label }}</button>
            </div>
        </form>
    </div>
</div>
