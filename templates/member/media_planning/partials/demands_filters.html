<div class="px-4 pt-3 pb-3 space-y-3">
    <!-- Chips de filtro rápido -->
    <div class="flex gap-2 overflow-x-auto pb-0.5 -mx-1 px-1">
        <a href="?kind=all{% if filter_q %}&q={{ filter_q|urlencode }}{% endif %}{% if filter_responsible %}&responsible={{ filter_responsible }}{% endif %}{% if filter_team %}&team={{ filter_team }}{% endif %}{% if filter_event_type %}&event_type={{ filter_event_type }}{% endif %}{% if filter_period_from %}&period_from={{ filter_period_from }}{% endif %}{% if filter_period_to %}&period_to={{ filter_period_to }}{% endif %}{% if selected %}&selected={{ selected }}{% endif %}"
           class="media-chip {% if filter_kind == 'all' or not filter_kind %}active{% endif %}">Todos</a>
        <a href="?kind=events{% if filter_q %}&q={{ filter_q|urlencode }}{% endif %}{% if filter_responsible %}&responsible={{ filter_responsible }}{% endif %}{% if filter_team %}&team={{ filter_team }}{% endif %}{% if filter_event_type %}&event_type={{ filter_event_type }}{% endif %}{% if filter_period_from %}&period_from={{ filter_period_from }}{% endif %}{% if filter_period_to %}&period_to={{ filter_period_to }}{% endif %}"
           class="media-chip {% if filter_kind == 'events' %}active{% endif %}">Eventos</a>
        <a href="?kind=free{% if filter_q %}&q={{ filter_q|urlencode }}{% endif %}{% if filter_responsible %}&responsible={{ filter_responsible }}{% endif %}{% if filter_team %}&team={{ filter_team }}{% endif %}{% if filter_period_from %}&period_from={{ filter_period_from }}{% endif %}{% if filter_period_to %}&period_to={{ filter_period_to }}{% endif %}"
           class="media-chip {% if filter_kind == 'free' %}active{% endif %}">Conteúdos livres</a>
    </div>

    <!-- Busca + botões -->
    <form method="get" id="demands-filter-form" class="space-y-3">
        <input type="hidden" name="kind" value="{{ filter_kind|default:'all' }}">
        {% if selected %}<input type="hidden" name="selected" value="{{ selected }}">{% endif %}

        <div class="flex items-center gap-2">
            <div class="relative flex-1 min-w-0">
                <input type="search"
                       name="q"
                       value="{{ filter_q }}"
                       placeholder="Buscar eventos ou conteúdos..."
                       class="media-search-input"
                       autocomplete="off">
            </div>

            <button type="submit"
                    class="media-btn-icon flex-shrink-0"
                    style="background: linear-gradient(135deg, #8B5CF6, #7C3AED); border-color: transparent; color: #fff; box-shadow: 0 2px 10px rgba(139,92,246,0.35);"
                    title="Buscar">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </button>

            <div class="relative flex-shrink-0">
                <button type="button"
                        id="demands-filter-toggle"
                        class="px-3 py-2 border border-gray-300 bg-white text-gray-700 rounded-lg hover:bg-gray-50 transition-all duration-200 flex items-center gap-2 text-sm"
                        aria-expanded="false"
                        aria-controls="demands-filter-panel">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z"/>
                    </svg>
                    <span class="hidden sm:inline">Filtros</span>
                    {% if filter_responsible or filter_team or filter_event_type or filter_period_from or filter_period_to %}
                    <span class="w-2 h-2 rounded-full flex-shrink-0" style="background: #8B5CF6;"></span>
                    {% endif %}
                </button>

                <div id="demands-filter-panel"
                     class="hidden absolute right-0 top-full mt-2 w-[min(20rem,calc(100vw-2rem))] bg-white border border-gray-200 rounded-xl shadow-lg z-50 p-4">
                    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Filtros</p>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Responsável</label>
                            <select name="responsible" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#8B5CF6] text-sm bg-white cursor-pointer">
                                <option value="">Todos</option>
                                {% for u in users %}
                                <option value="{{ u.pk }}" {% if filter_responsible == u.pk|stringformat:"s" %}selected{% endif %}>{{ u.member.name|default:u.email }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Equipe</label>
                            <select name="team" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#8B5CF6] text-sm bg-white cursor-pointer">
                                <option value="">Todas</option>
                                {% for t in teams %}
                                <option value="{{ t.pk }}" {% if filter_team == t.pk|stringformat:"s" %}selected{% endif %}>{{ t.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Tipo de evento</label>
                            <select name="event_type" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#8B5CF6] text-sm bg-white cursor-pointer">
                                <option value="">Todos</option>
                                {% for et in event_types %}
                                <option value="{{ et.pk }}" {% if filter_event_type == et.pk|stringformat:"s" %}selected{% endif %}>{{ et.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Período — de</label>
                            <input type="date" name="period_from" value="{{ filter_period_from }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#8B5CF6] text-sm bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Período — até</label>
                            <input type="date" name="period_to" value="{{ filter_period_to }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#8B5CF6] text-sm bg-white">
                        </div>
                    </div>
                    <div class="flex gap-2 mt-4 pt-3 border-t border-gray-100">
                        <a href="{% url 'media_content_list' %}{% if selected %}?selected={{ selected }}{% endif %}"
                           class="flex-1 text-center px-3 py-2 text-sm text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-lg transition-all">
                            Limpar filtros
                        </a>
                        <button type="submit"
                                id="demands-apply-filters"
                                class="flex-1 px-3 py-2 text-sm text-white rounded-lg hover:opacity-90 transition-all"
                                style="background: linear-gradient(135deg, #8B5CF6, #7C3AED);">
                            Aplicar
                        </button>
                    </div>
                </div>
            </div>

            {% if is_media_leader %}
            <div class="relative flex-shrink-0">
                <button type="button"
                        id="demands-create-toggle"
                        class="media-btn-primary sm"
                        aria-expanded="false"
                        aria-controls="demands-create-menu">
                    <i class="fas fa-plus"></i>
                    <span class="hidden sm:inline">Criar</span>
                </button>
                <div id="demands-create-menu" class="media-create-menu" hidden>
                    <a href="#" data-open-modal="demands-modal-demand">
                        <i class="fas fa-film"></i> Nova demanda
                    </a>
                    <a href="#" data-open-modal="demands-modal-event">
                        <i class="fas fa-calendar-plus"></i> Novo evento
                    </a>
                </div>
            </div>
            {% endif %}
        </div>
    </form>
</div>
