<div class="overflow-hidden rounded-xl sm:rounded-2xl border-2" data-ministry-card data-card-label="Boas Vindas"
            data-card-icon="hand-holding-heart"
            style="border-color: rgba(201, 9, 5, 0.25); background: linear-gradient(to bottom right, #ffffff, #f9fafb, #ffffff);">
            <div class="w-full flex items-center justify-between gap-4 p-4 sm:p-5">
                <div class="flex items-center gap-3 sm:gap-4">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center flex-shrink-0"
                        style="background-color: #C90905;">
                        <i class="fas fa-hand-holding-heart text-white text-lg sm:text-xl"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="text-xl sm:text-2xl font-black text-gray-900 leading-tight">
                            Ministério de <span style="color: #C90905;">Boas Vindas</span>
                        </h3>
                        <p class="text-sm text-gray-500 mt-0.5">Cadastre e visualize visitantes</p>
                    </div>
                </div>
            </div>

            <!-- Ferramentas do ministério -->
            <div class="ministry-tools">
                <div class="px-4 pb-4 pt-1 sm:px-5 sm:pb-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <a href="{% url 'member_visitor_create' %}"
                            class="group flex items-center justify-between bg-white rounded-xl p-4 border-2 transition-all duration-300 hover:-translate-y-1"
                            style="border-color: rgba(201, 9, 5, 0.3);">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
                                    style="background: rgba(201, 9, 5, 0.1);">
                                    <i class="fas fa-user-plus text-sm" style="color: #C90905;"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-gray-900">Cadastrar Visitante</h4>
                                    <p class="text-xs text-gray-500">Registrar novo visitante</p>
                                </div>
                            </div>
                            <i class="fas fa-arrow-right text-sm transition-transform group-hover:translate-x-1"
                                style="color: #C90905;"></i>
                        </a>
                        <a href="{% url 'member_visitor_list' %}"
                            class="group flex items-center justify-between bg-white rounded-xl p-4 border-2 transition-all duration-300 hover:-translate-y-1"
                            style="border-color: rgba(201, 9, 5, 0.3);">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
                                    style="background: rgba(230, 57, 70, 0.1);">
                                    <i class="fas fa-list text-sm" style="color: #E63946;"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-gray-900">Ver Visitantes</h4>
                                    <p class="text-xs text-gray-500">Histórico de visitas</p>
                                </div>
                            </div>
                            <i class="fas fa-arrow-right text-sm transition-transform group-hover:translate-x-1"
                                style="color: #E63946;"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
