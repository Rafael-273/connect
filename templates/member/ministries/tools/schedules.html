<div class="overflow-hidden rounded-xl sm:rounded-2xl border-2"
            style="border-color: rgba(201, 9, 5, 0.25); background: linear-gradient(to bottom right, #ffffff, #f9fafb, #ffffff);">
            <div class="w-full flex items-center justify-between gap-4 p-4 sm:p-5">
                <div class="flex items-center gap-3 sm:gap-4">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center flex-shrink-0"
                        style="background-color: #C90905;">
                        <i class="fas fa-calendar-check text-white text-lg sm:text-xl"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="text-xl sm:text-2xl font-black text-gray-900 leading-tight">
                            Escalas do <span style="color: #C90905;">Mês</span>
                        </h3>
                        <p class="text-sm text-gray-500 mt-0.5">{{ member_schedules|length }} escala{{member_schedules|length|pluralize:"s" }} disponíve{{member_schedules|length|pluralize:"l,is" }}</p>
                    </div>
                </div>
            </div>

            <!-- Ferramentas do ministério -->
            <div class="ministry-tools">
                <div class="px-4 pb-4 pt-1 sm:px-5 sm:pb-5">
                    <div class="flex flex-col gap-3">
                        {% for schedule in member_schedules %}
                        <a href="{% url 'member_schedule_detail' schedule.id %}"
                            class="group flex items-center justify-between bg-white rounded-xl p-4 border-2 transition-all duration-300 hover:-translate-y-1"
                            style="border-color: rgba(201, 9, 5, 0.3);">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
                                    style="background: rgba(201, 9, 5, 0.1);">
                                    <i class="fas fa-calendar-alt text-sm" style="color: #C90905;"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-gray-900">{{ schedule.title }}</h4>
                                    <p class="text-xs text-gray-500">{{ schedule.ministry.name }} · {{ schedule.month}}/{{ schedule.year }}</p>
                                </div>
                            </div>
                            <i class="fas fa-arrow-right text-sm transition-transform group-hover:translate-x-1"
                                style="color: #C90905;"></i>
                        </a>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
