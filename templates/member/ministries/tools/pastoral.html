<div class="overflow-hidden rounded-xl sm:rounded-2xl border-2" data-ministry-card data-card-label="Área Pastoral"
            data-card-icon="user-tie"
            style="border-color: rgba(201, 9, 5, 0.25); background: linear-gradient(to bottom right, #ffffff, #f9fafb, #ffffff);">
            <div class="w-full flex items-center justify-between gap-4 p-4 sm:p-5">
                <div class="flex items-center gap-3 sm:gap-4">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center flex-shrink-0" style="background-color: #C90905;">

                    </div>
                    <div class="text-left">
                        <h3 class="text-xl sm:text-2xl font-black text-gray-900 leading-tight">Área <span style="color: #C90905;">Pastoral</span></h3>

                </div>
            </div>

                <div class="px-4 pb-4 pt-1 sm:px-5 sm:pb-5">

                        <a href="{% url 'pastoral_visitor_report' %}" class="group flex items-center justify-between bg-white rounded-xl p-4 border-2 transition-all duration-300 hover:-translate-y-1" style="border-color: rgba(201, 9, 5, 0.3);">

                            <i class="fas fa-chart-bar text-lg" style="color: #C90905;"></i>

                    </div>
                </div>
