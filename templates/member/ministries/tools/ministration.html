<div class="overflow-hidden rounded-xl sm:rounded-2xl border-2"
            style="border-color: rgba(201, 9, 5, 0.25); background: linear-gradient(to bottom right, #ffffff, #f9fafb, #ffffff);">
            <div class="w-full flex items-center justify-between gap-4 p-4 sm:p-5">
                <div class="flex items-center gap-3 sm:gap-4">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center flex-shrink-0"
                        style="background-color: #C90905;">
                        <i class="fas fa-lightbulb text-white text-lg sm:text-xl"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="text-xl sm:text-2xl font-black text-gray-900 leading-tight">
                            Palavras de <span style="color: #C90905;">Conhecimento</span>
                        </h3>
                        <p class="text-sm text-gray-500 mt-0.5">Registre palavras e curas</p>
                    </div>
                </div>
            </div>

            <!-- Ferramentas do ministério -->
            <div class="ministry-tools">
                <div class="px-4 pb-4 sm:px-5 sm:pb-5">
                    <!-- Formulário Rápido -->
                    <form method="post" action="{% url 'word_of_knowledge_create' %}"
                        class="bg-white rounded-xl p-4 sm:p-5 border-2 mb-4" style="border-color: rgba(201, 9, 5, 0.3);"
                        onsubmit="showLoadingOverlay(event)">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="block text-sm font-bold mb-2" style="color: #C90905;">
                                <i class="fas fa-edit mr-2"></i><span class="inline-block mt-1">Registrar Nova Palavra</span>
                            </label>
                            <textarea name="word" rows="5" required
                                class="w-full px-4 py-3 border-2 rounded-xl bg-gray-50 focus:bg-white focus:outline-none transition-all resize-none focus:border-red-600 text-sm"
                                style="border-color: rgba(201, 9, 5, 0.2); min-height: 8rem;"
                                placeholder="Escreva a palavra de conhecimento aqui..."></textarea>
                        </div>
                        <button type="submit"
                            class="w-full sm:w-auto px-6 py-3 text-white font-bold rounded-xl transition-all hover:-translate-y-0.5 text-sm"
                            style="background-color: #C90905;">
                            <i class="fas fa-save mr-2"></i><span class="inline-block mt-1">Enviar</span>
                        </button>
                    </form>

                    <!-- Links Rápidos -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <a href="{% url 'word_of_knowledge_list' %}"
                            class="group flex items-center justify-between bg-white rounded-xl p-4 border-2 transition-all duration-300 hover:-translate-y-1"
                            style="border-color: rgba(201, 9, 5, 0.3);">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
                                    style="background: rgba(201, 9, 5, 0.1);">
                                    <i class="fas fa-list text-sm" style="color: #C90905;"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-gray-900">Palavras e Curas</h4>
                                    <p class="text-xs text-gray-500">Ver histórico</p>
                                </div>
                            </div>
                            <i class="fas fa-arrow-right text-sm transition-transform group-hover:translate-x-1"
                                style="color: #C90905;"></i>
                        </a>
                        <a href="{% url 'service_words_view' %}"
                            class="group flex items-center justify-between bg-white rounded-xl p-4 border-2 transition-all duration-300 hover:-translate-y-1"
                            style="border-color: rgba(201, 9, 5, 0.3);">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
                                    style="background: rgba(230, 57, 70, 0.1);">
                                    <i class="fas fa-calendar-alt text-sm" style="color: #E63946;"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-bold text-gray-900">Próximo Culto</h4>
                                    <p class="text-xs text-gray-500">Ver palavras do culto</p>
                                </div>
                            </div>
                            <i class="fas fa-arrow-right text-sm transition-transform group-hover:translate-x-1"
                                style="color: #E63946;"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
