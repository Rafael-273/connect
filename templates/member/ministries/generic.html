{% extends "member/ministries/detail_base.html" %}

{% block ministry_tools %}
<section class="rounded-2xl border border-gray-100 bg-white p-5">
    <h1 class="text-xl font-bold text-gray-900">{{ ministry.name }}</h1>
    {% if ministry.description %}<p class="mt-2 text-sm text-gray-600">{{ ministry.description }}</p>{% endif %}
    {% if not member_schedules %}<p class="mt-3 text-sm text-gray-500">Nenhuma ferramenta disponível para este ministério no momento.</p>{% endif %}
</section>
{% endblock %}
