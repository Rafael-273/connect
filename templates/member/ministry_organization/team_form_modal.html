<div class="demands-modal-header-accent">
    <div class="demands-modal-header">
        <div class="demands-modal-header-main">
            <span class="demands-modal-icon" aria-hidden="true"><i class="fas fa-users"></i></span>
            <div><p class="demands-modal-eyebrow">{{ ministry.name }}</p><h2 id="team-default-modal-title" class="demands-modal-title">Editar equipe</h2><p class="demands-modal-subtitle">Atualize as informações de {{ team.name }}.</p></div>
        </div>
        <button type="button" class="demands-modal-close" data-team-modal-close aria-label="Fechar"><i class="fas fa-times"></i></button>
    </div>
</div>
<form id="team-default-modal-form" method="post" action="{{ request.path }}" class="demands-modal-form" novalidate>
    {% csrf_token %}
    <div class="demands-modal-body space-y-4">{% include 'member/ministry_organization/form_fields.html' %}</div>
    <div class="demands-modal-footer"><button type="button" class="org-btn-secondary" data-team-modal-close>Cancelar</button><button type="submit" class="org-btn-primary">Salvar</button></div>
</form>
