<div class="space-y-2">
    {% for manual in manuals %}
    <a href="{% url 'ministry_manual_detail' ministry.pk manual.pk %}"
       class="org-card flex items-start gap-3 p-4 block">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
             style="background:rgba(201, 9, 5,.1);">
            <i class="fas fa-book text-sm" style="color:#C90905;"></i>
        </div>
        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
                <h3 class="font-semibold text-sm text-gray-900">{{ manual.title }}</h3>
                {% if not manual.is_active %}
                <span class="text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded-full">Arquivado</span>
                {% endif %}
            </div>
            <p class="text-xs text-gray-500 mt-0.5">{{ manual.sub_team.name|default:'Todo o ministério' }}</p>
            {% if manual.summary %}
            <p class="text-xs text-gray-600 mt-1">{{ manual.summary|truncatewords:28 }}</p>
            {% endif %}
        </div>
        <i class="fas fa-chevron-right text-gray-300 text-xs flex-shrink-0 mt-1"></i>
    </a>
    {% empty %}
    <div class="bg-white rounded-xl border border-gray-100 p-10 text-center">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3"
             style="background:rgba(201, 9, 5,.1);">
            <i class="fas fa-book text-lg" style="color:#C90905;"></i>
        </div>
        <p class="text-sm text-gray-500 font-semibold">Nenhum manual encontrado.</p>
    </div>
    {% endfor %}
</div>
