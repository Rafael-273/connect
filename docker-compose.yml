services:
  connect-database : 
    image: postgres:16-alpine
    container_name: connect-database  
    ports:
      - "5432:${DB_PORT}"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - connect-network

  redis:
    image: redis/redis-stack-server:latest
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - connect-network

  web-project:
    hostname: "${HOSTNAME}"
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /usr/src/platform
    command: >
      bash -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate &&
        python manage.py runserver ${HOSTNAME}:${PORT}
      "
    volumes:
      - ./:/usr/src/platform
      - media_volume:/usr/src/platform/media
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PYTHONUNBUFFERED=True
      - OAUTHLIB_INSECURE_TRANSPORT=False
      - USE_S3=${USE_S3:-FALSE}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
    env_file:
      - .env
    depends_on:
      - connect-database 
      - redis
    networks:
      - connect-network

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /usr/src/platform
    command: >
      python -m watchdog.watchmedo auto-restart --directory=/usr/src/platform/website --pattern='*.py' --recursive --
      celery -A connect worker --loglevel=info --concurrency=1 -Q celery
    volumes:
      - ./:/usr/src/platform
      - media_volume:/usr/src/platform/media
    environment:
      - PYTHONUNBUFFERED=True
      - USE_S3=${USE_S3:-FALSE}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-}
    env_file:
      - .env
    depends_on:
      - connect-database
      - redis
    networks:
      - connect-network

networks:
  connect-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_volume:
